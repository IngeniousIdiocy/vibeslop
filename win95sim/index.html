<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Win95Sim Phase 1 Prototype</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      color-scheme: light;
    }

    body {
      margin: 0;
      font-family: "W95Sans", Tahoma, "MS Sans Serif", Arial, sans-serif;
      background: #1d1d1d;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #app-shell {
      position: relative;
      width: min(100vw, 960px);
      height: min(100vh, 720px);
      display: flex;
      flex-direction: column;
    }

    #monitor {
      flex: 1 1 auto;
      background: #222;
      border: 20px solid #3c3c3c;
      border-radius: 18px;
      padding: 12px;
      display: flex;
      align-items: stretch;
      justify-content: center;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.6);
    }

    #crt {
      position: relative;
      flex: 1 1 auto;
      background: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
    }

    #crt[data-scale="pixel"] {
      overflow: auto;
    }

    #desktop-root {
      position: relative;
      background: #008080;
      width: 1024px;
      height: 768px;
      box-shadow: inset 0 0 40px rgba(0,0,0,0.35);
      transform-origin: top left;
    }

    #taskbar {
      flex: 0 0 40px;
      display: flex;
      align-items: center;
      padding: 4px;
      background: #c0c0c0;
      border-top: 2px solid #ffffff;
      box-shadow: inset 0 1px 0 #dfdfdf, inset 0 -1px 0 #808080;
      gap: 4px;
    }

    #start-button {
      width: 70px;
      height: 100%;
      font-family: inherit;
      border: none;
      background: #c0c0c0;
      box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080;
      cursor: pointer;
    }

    #taskband {
      flex: 1 1 auto;
      background: #c0c0c0;
      border: 1px solid #808080;
      box-shadow: inset 1px 1px 0 #ffffff;
    }

    #taskbar-right {
      width: 80px;
      text-align: center;
      font-size: 12px;
      color: #000;
    }

    .w95-window {
      position: absolute;
      box-sizing: border-box;
      border: 2px solid #000000;
      background: #c0c0c0;
      box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
      min-width: 120px;
      min-height: 80px;
      outline: none;
    }

    .explorer {
      display: flex;
      height: 100%;
      font-family: inherit;
      font-size: 13px;
      background: #ffffff;
    }

    .explorer__sidebar {
      width: 180px;
      border-right: 1px solid #808080;
      background: #d6d6d6;
      padding: 4px;
      overflow: auto;
    }

    .explorer__tree-item {
      padding: 2px 6px;
      border: 1px solid transparent;
      border-radius: 2px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }

    .explorer__tree-item[data-active="true"] {
      background: #000080;
      color: #ffffff;
    }

    .explorer__content {
      flex: 1 1 auto;
      display: flex;
      flex-direction: column;
      background: #ffffff;
    }

    .explorer__toolbar {
      display: flex;
      gap: 4px;
      padding: 4px;
      background: #c0c0c0;
      border-bottom: 1px solid #808080;
    }

    .explorer__toolbar button {
      font-family: inherit;
      font-size: 12px;
      padding: 2px 8px;
      border: 1px solid #808080;
      background: #dfdfdf;
      cursor: pointer;
    }

    .explorer__toolbar button:active {
      box-shadow: inset 1px 1px 0 #808080;
    }

    .explorer__list {
      flex: 1 1 auto;
      overflow: auto;
      background: #ffffff;
    }

    .explorer__list table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    .explorer__list thead {
      background: #d6d6d6;
      position: sticky;
      top: 0;
    }

    .explorer__list th,
    .explorer__list td {
      padding: 2px 6px;
      border-bottom: 1px solid #dfdfdf;
      text-align: left;
    }

    .explorer__list tr[data-selected="true"] {
      background: #000080;
      color: #ffffff;
    }

    .explorer__status {
      padding: 2px 6px;
      background: #c0c0c0;
      border-top: 1px solid #808080;
      font-size: 12px;
    }

    .w95-window[aria-active="true"] .w95-window__titlebar {
      background: linear-gradient(90deg, #000080, #1084d0);
      color: #ffffff;
    }

    .w95-window[aria-active="false"] .w95-window__titlebar {
      background: linear-gradient(90deg, #808080, #c0c0c0);
      color: #dcdcdc;
    }

    .w95-window__titlebar {
      height: 18px;
      display: flex;
      align-items: center;
      padding: 0 2px;
      gap: 2px;
      user-select: none;
      cursor: move;
    }

    .w95-window__sys-btn,
    .w95-window__caption-btn {
      width: 16px;
      height: 14px;
      border: none;
      background: #c0c0c0;
      box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      padding: 0;
      cursor: pointer;
    }

    .w95-window__title {
      flex: 1 1 auto;
      font-size: 12px;
      line-height: 1;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .w95-window__content {
      flex: 1 1 auto;
      background: #ffffff;
      border: 2px solid #ffffff;
      box-shadow: inset 0 0 0 1px #808080;
      position: relative;
    }

    .w95-window__resize-handle {
      position: absolute;
      z-index: 5;
    }

    .w95-window__resize-handle[data-edge="n"],
    .w95-window__resize-handle[data-edge="s"] {
      left: 0;
      width: 100%;
      height: 5px;
      cursor: ns-resize;
    }

    .w95-window__resize-handle[data-edge="e"],
    .w95-window__resize-handle[data-edge="w"] {
      top: 0;
      width: 5px;
      height: 100%;
      cursor: ew-resize;
    }

    .w95-window__resize-handle[data-edge="ne"],
    .w95-window__resize-handle[data-edge="nw"],
    .w95-window__resize-handle[data-edge="se"],
    .w95-window__resize-handle[data-edge="sw"] {
      width: 10px;
      height: 10px;
    }

    .w95-window__resize-handle[data-edge="n"] { top: -3px; }
    .w95-window__resize-handle[data-edge="s"] { bottom: -3px; }
    .w95-window__resize-handle[data-edge="e"] { right: -3px; }
    .w95-window__resize-handle[data-edge="w"] { left: -3px; }
    .w95-window__resize-handle[data-edge="ne"] { top: -3px; right: -3px; cursor: nesw-resize; }
    .w95-window__resize-handle[data-edge="nw"] { top: -3px; left: -3px; cursor: nwse-resize; }
    .w95-window__resize-handle[data-edge="se"] { bottom: -3px; right: -3px; cursor: nwse-resize; }
    .w95-window__resize-handle[data-edge="sw"] { bottom: -3px; left: -3px; cursor: nesw-resize; }

    #task-switcher {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0.35);
      z-index: 6000;
    }

    #task-switcher[data-visible="true"] {
      display: flex;
    }

    #task-switcher ul {
      list-style: none;
      padding: 8px;
      margin: 0;
      min-width: 200px;
      background: #c0c0c0;
      border: 2px solid #000;
      box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080;
    }

    #task-switcher li {
      padding: 4px 8px;
      font-size: 13px;
      background: #c0c0c0;
      color: #000;
    }

    #task-switcher li[data-active="true"] {
      background: #000080;
      color: #fff;
    }

    #boot-splash {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000000;
      color: #ffffff;
      z-index: 9999;
      font-family: "W95Sans", Tahoma, sans-serif;
      font-size: 20px;
      letter-spacing: 2px;
    }

    #system-menu {
      position: absolute;
      display: none;
      background: #c0c0c0;
      border: 2px solid #000000;
      box-shadow: inset 1px 1px 0 #ffffff, inset -1px -1px 0 #808080;
      font-size: 12px;
      z-index: 8000;
    }

    #system-menu[aria-hidden="false"] {
      display: block;
    }

    #system-menu button {
      display: block;
      width: 140px;
      padding: 4px 10px;
      border: none;
      background: #c0c0c0;
      text-align: left;
      font-family: inherit;
      cursor: default;
    }

    #system-menu button:hover {
      background: #000080;
      color: #fff;
    }
  </style>
  <template id="tpl-window">
    <div class="w95-window" role="dialog" aria-active="false">
      <div class="w95-window__frame">
        <div class="w95-window__titlebar" data-role="titlebar">
          <button class="w95-window__sys-btn" data-action="system" aria-label="System Menu">■</button>
          <div class="w95-window__title" data-role="title">Window</div>
          <div class="w95-window__caption-buttons">
            <button class="w95-window__caption-btn" data-action="minimize" aria-label="Minimize">_</button>
            <button class="w95-window__caption-btn" data-action="maximize" aria-label="Maximize">▢</button>
            <button class="w95-window__caption-btn" data-action="close" aria-label="Close">✕</button>
          </div>
        </div>
        <div class="w95-window__content" data-role="content">
          <div class="w95-window__resize-handle" data-edge="n"></div>
          <div class="w95-window__resize-handle" data-edge="s"></div>
          <div class="w95-window__resize-handle" data-edge="e"></div>
          <div class="w95-window__resize-handle" data-edge="w"></div>
          <div class="w95-window__resize-handle" data-edge="ne"></div>
          <div class="w95-window__resize-handle" data-edge="nw"></div>
          <div class="w95-window__resize-handle" data-edge="se"></div>
          <div class="w95-window__resize-handle" data-edge="sw"></div>
          <div class="w95-window__body" data-role="body"></div>
        </div>
      </div>
    </div>
  </template>
</head>
<body>
  <div id="app-shell">
    <div id="boot-splash" role="alert" aria-live="assertive">Starting Windows 95...</div>
    <div id="monitor">
      <div id="crt" data-scale="pixel">
        <div id="desktop-root" role="application" aria-label="Windows 95 Desktop"></div>
      </div>
    </div>
    <div id="taskbar" role="menubar">
      <button id="start-button" type="button">Start</button>
      <div id="taskband" aria-live="polite"></div>
      <div id="taskbar-right"></div>
    </div>
    <div id="task-switcher" aria-hidden="true">
      <ul id="task-switcher-list"></ul>
    </div>
    <div id="system-menu" aria-hidden="true" role="menu"></div>
  </div>
  <script id="sfm">
    (function(){
      const modules = new Map();
      const factories = new Map();
      const resolving = new Set();

      function resolve(id) {
        if (modules.has(id)) {
          return modules.get(id);
        }
        if (!factories.has(id)) {
          throw new Error("Module not found: " + id);
        }
        if (resolving.has(id)) {
          throw new Error("Circular dependency detected while resolving " + id);
        }
        resolving.add(id);
        const { deps, factory } = factories.get(id);
        const resolvedDeps = deps.map((dep) => {
          if (dep === 'require') return require;
          if (dep === 'exports') return {};
          if (dep === 'module') return { id };
          return resolve(dep);
        });
        const moduleExports = {};
        const finalDeps = resolvedDeps.map((dep, index) => {
          if (deps[index] === 'exports') {
            return moduleExports;
          }
          if (deps[index] === 'module') {
            return { id, exports: moduleExports };
          }
          return dep;
        });
        const returned = factory.apply(null, finalDeps);
        const exportsObj = returned !== undefined ? returned : moduleExports;
        modules.set(id, exportsObj);
        resolving.delete(id);
        return exportsObj;
      }

      function define(id, deps, factory) {
        if (factories.has(id)) {
          throw new Error("Module already defined: " + id);
        }
        factories.set(id, { deps, factory });
      }

      function require(ids, cb) {
        if (typeof ids === 'string') {
          return resolve(ids);
        }
        const resolved = ids.map(resolve);
        if (cb) {
          cb.apply(null, resolved);
        }
      }

      Object.assign(globalThis, { define, require });
    })();
  </script>
  <script id="modules">
    define('core/kernel', [], function () {
      const listeners = new Map();

      function on(evt, fn) {
        if (!listeners.has(evt)) {
          listeners.set(evt, new Set());
        }
        listeners.get(evt).add(fn);
        return () => off(evt, fn);
      }

      function once(evt, fn) {
        const wrapped = (payload) => {
          off(evt, wrapped);
          fn(payload);
        };
        return on(evt, wrapped);
      }

      function off(evt, fn) {
        if (!listeners.has(evt)) return;
        listeners.get(evt).delete(fn);
      }

      function emit(evt, payload) {
        if (!listeners.has(evt)) return;
        [...listeners.get(evt)].forEach((fn) => {
          try {
            fn(payload);
          } catch (err) {
            console.error('kernel listener error', err);
          }
        });
      }

      let counter = 0;
      function uid(prefix = 'id') {
        counter += 1;
        return `${prefix}_${Date.now().toString(36)}_${counter.toString(36)}`;
      }

      function now() {
        return Date.now();
      }

      return Object.freeze({ on, once, off, emit, uid, now });
    });

    define('svc/settings', ['core/kernel'], function (kernel) {
      const store = new Map();
      const watchers = new Map();

      const defaults = {
        'theme': 'standard',
        'sound.enabled': false,
        'display.mode': 'pixel',
        'display.integerScale': 1,
        'display.resolution': { w: 1024, h: 768 },
        'display.crt.enabled': false,
        'display.crt.intensity': 0.15,
        'keyboard.repeatRate': 500,
        'mouse.pointerSpeed': 1
      };

      Object.entries(defaults).forEach(([key, value]) => {
        store.set(key, value);
      });

      function notify(key, value) {
        kernel.emit('settings:change', { key, value });
        if (!watchers.has(key)) return;
        [...watchers.get(key)].forEach((fn) => {
          try { fn(value); } catch (err) { console.error('settings watcher error', err); }
        });
      }

      function get(key) {
        return store.get(key);
      }

      function set(key, value) {
        store.set(key, value);
        notify(key, value);
      }

      function watch(key, fn) {
        if (!watchers.has(key)) {
          watchers.set(key, new Set());
        }
        watchers.get(key).add(fn);
        return () => {
          watchers.get(key).delete(fn);
        };
      }

      return Object.freeze({ get, set, watch });
    });

    define('svc/display', ['svc/settings', 'core/kernel'], function (settings, kernel) {
      let crtEl = null;
      let desktopEl = null;
      let monitorEl = null;
      let currentResolution = { ...settings.get('display.resolution') };
      let scaleMode = settings.get('display.mode');

      function applyResolution() {
        if (!desktopEl) return;
        desktopEl.style.width = `${currentResolution.w}px`;
        desktopEl.style.height = `${currentResolution.h}px`;
      }

      function computeFitScale() {
        if (!crtEl || !desktopEl) return 1;
        const viewport = crtEl.getBoundingClientRect();
        const scaleX = viewport.width / currentResolution.w;
        const scaleY = viewport.height / currentResolution.h;
        return Math.min(scaleX, scaleY);
      }

      function computeIntegerScale() {
        if (!crtEl || !desktopEl) return 1;
        const viewport = crtEl.getBoundingClientRect();
        const maxScale = Math.floor(Math.min(
          viewport.width / currentResolution.w,
          viewport.height / currentResolution.h
        ));
        return Math.max(1, maxScale);
      }

      function applyScaleMode() {
        if (!crtEl || !desktopEl) return;
        crtEl.dataset.scale = scaleMode;
        if (scaleMode === 'pixel') {
          desktopEl.style.transform = 'scale(1)';
          crtEl.style.justifyContent = 'flex-start';
          crtEl.style.alignItems = 'flex-start';
          return;
        }
        const scale = scaleMode === 'fit' ? computeFitScale() : settings.get('display.integerScale');
        desktopEl.style.transform = `scale(${scale})`;
        crtEl.style.justifyContent = 'center';
        crtEl.style.alignItems = 'center';
      }

      function init(ctx = {}) {
        if (ctx.crt) {
          crtEl = ctx.crt;
        } else if (typeof document !== 'undefined') {
          crtEl = document.getElementById('crt');
        }
        if (ctx.desktop) {
          desktopEl = ctx.desktop;
        } else if (typeof document !== 'undefined') {
          desktopEl = document.getElementById('desktop-root');
        }
        if (ctx.monitor) {
          monitorEl = ctx.monitor;
        } else if (typeof document !== 'undefined') {
          monitorEl = document.getElementById('monitor');
        }
        applyResolution();
        applyScaleMode();
      }

      function setResolution(res) {
        currentResolution = { ...res };
        settings.set('display.resolution', currentResolution);
        applyResolution();
        applyScaleMode();
        kernel.emit('display:change', { type: 'resolution', value: currentResolution });
      }

      function setScaleMode(mode) {
        scaleMode = mode;
        settings.set('display.mode', mode);
        if (mode === 'integer') {
          const scale = computeIntegerScale();
          settings.set('display.integerScale', scale);
        }
        applyScaleMode();
        kernel.emit('display:change', { type: 'scaleMode', value: mode });
      }

      function getResolution() {
        return { ...currentResolution };
      }

      function getScaleMode() {
        return scaleMode;
      }

      function getViewport() {
        if (!crtEl) return { width: 0, height: 0 };
        const rect = crtEl.getBoundingClientRect();
        return { width: rect.width, height: rect.height };
      }

      function setWallpaper() {
        // stub for phase 1
      }

      function setDesktopColor(color) {
        if (!desktopEl) return;
        desktopEl.style.background = color;
        kernel.emit('display:change', { type: 'desktopColor', value: color });
      }

      function setColorDepthSim() {
        // stub for phase 1
      }

      settings.watch('display.mode', (mode) => {
        scaleMode = mode;
        applyScaleMode();
      });

      return Object.freeze({
        init,
        getResolution,
        setResolution,
        getScaleMode,
        setScaleMode,
        getViewport,
        setWallpaper,
        setDesktopColor,
        setColorDepthSim
      });
    });

    define('svc/window', ['core/kernel', 'svc/display'], function (kernel, display) {
      const windows = [];
      let zCounter = 100;
      let desktopEl = null;
      let taskbandEl = null;
      let template = null;
      let systemMenu = null;
      let taskSwitcher = null;
      let taskSwitcherList = null;
      let startButton = null;
      let createWindowElement = null;
      let activeWindow = null;

      const pointerState = {
        type: null,
        win: null,
        startX: 0,
        startY: 0,
        rect: null,
        edge: null
      };

      function init(options = {}) {
        if (options.desktop) {
          desktopEl = options.desktop;
        } else if (typeof document !== 'undefined') {
          desktopEl = document.getElementById('desktop-root');
        }
        if (options.taskband) {
          taskbandEl = options.taskband;
        } else if (typeof document !== 'undefined') {
          taskbandEl = document.getElementById('taskband');
        }
        if (options.template) {
          template = options.template;
        } else if (typeof document !== 'undefined') {
          template = document.getElementById('tpl-window');
        }
        if (options.systemMenu) {
          systemMenu = options.systemMenu;
        } else if (typeof document !== 'undefined') {
          systemMenu = document.getElementById('system-menu');
        }
        if (options.taskSwitcher) {
          taskSwitcher = options.taskSwitcher;
          taskSwitcherList = options.taskSwitcherList || taskSwitcher?.querySelector('#task-switcher-list') || null;
        } else if (typeof document !== 'undefined') {
          taskSwitcher = document.getElementById('task-switcher');
          taskSwitcherList = document.getElementById('task-switcher-list');
        }
        if (options.startButton) {
          startButton = options.startButton;
        } else if (typeof document !== 'undefined') {
          startButton = document.getElementById('start-button');
        }
        createWindowElement = options.createWindowElement || (() => {
          if (!template) throw new Error('Window template missing');
          const fragment = template.content ? template.content.cloneNode(true) : template.cloneNode(true);
          return fragment.firstElementChild || fragment;
        });

        if (typeof document !== 'undefined') {
          document.addEventListener('pointermove', onPointerMove);
          document.addEventListener('pointerup', onPointerUp);
          document.addEventListener('keydown', onKeyDown);
        }
        if (startButton) {
          startButton.addEventListener('click', () => {
            focusWindow(activeWindow);
          });
        }
      }

      function layoutSystemMenu(win, anchor) {
        if (!systemMenu) return;
        systemMenu.innerHTML = '';
        const commands = [
          { id: 'restore', label: 'Restore', disabled: !win.state.maximized && !win.state.minimized },
          { id: 'move', label: 'Move', disabled: win.state.maximized },
          { id: 'size', label: 'Size', disabled: win.state.maximized },
          { id: 'minimize', label: 'Minimize', disabled: win.state.minimized },
          { id: 'maximize', label: 'Maximize', disabled: win.state.maximized },
          { id: 'close', label: 'Close', disabled: false }
        ];
        commands.forEach((cmd) => {
          const btn = document.createElement('button');
          btn.textContent = cmd.label;
          btn.dataset.command = cmd.id;
          if (cmd.disabled) {
            btn.disabled = true;
          }
          btn.addEventListener('click', () => {
            handleSystemCommand(win, cmd.id);
            hideSystemMenu();
          });
          systemMenu.appendChild(btn);
        });
        systemMenu.style.left = `${anchor.left}px`;
        systemMenu.style.top = `${anchor.bottom}px`;
        systemMenu.setAttribute('aria-hidden', 'false');
      }

      function hideSystemMenu() {
        if (!systemMenu) return;
        systemMenu.setAttribute('aria-hidden', 'true');
      }

      function handleSystemCommand(win, command) {
        if (command === 'restore') {
          if (win.state.maximized) {
            restore(win);
          } else if (win.state.minimized) {
            restore(win);
          }
        } else if (command === 'move') {
          startMove(win);
        } else if (command === 'size') {
          startResize(win, 'se');
        } else if (command === 'minimize') {
          minimize(win);
        } else if (command === 'maximize') {
          maximize(win);
        } else if (command === 'close') {
          close(win);

        const name = pathUtil.basename(normalized);
        const node = createNode({ name, kind: 'dir', parentId: parent.id });
        emitWatch('create', node);
        kernel.emit('fs:create', { path: node.path });
        return toMeta(node);
      }

      function move(src, dst, opts = {}) {
        ensureInitialised();
        const sourceNode = findNode(src);
        if (!sourceNode) {
          throw Object.assign(new Error('Source not found'), { code: 'E_NOENT', path: src });
        }
        const destPathInput = dst.startsWith('::') ? specialPaths.get(dst) || dst : dst;
        const destNormalized = pathUtil.normalize(destPathInput);
        const destParentPath = pathUtil.dirname(destNormalized);
        const destParent = findNode(destParentPath);
        if (!destParent || destParent.kind !== 'dir') {
          throw Object.assign(new Error('Destination parent missing'), { code: 'E_NOENT', path: destParentPath });
        }
        if (destParent.readonly) {
          throw Object.assign(new Error('Destination is read-only'), { code: 'E_DENIED', path: destParentPath });
        }
        const newName = pathUtil.basename(destNormalized);
        if (destParent.children && destParent.children.has(newName.toLowerCase()) && !opts.overwrite) {
          throw Object.assign(new Error('Destination exists'), { code: 'E_EXISTS', path: destNormalized });
        }
        const fromPath = sourceNode.path;
        detachFromParent(sourceNode);
        sourceNode.name = newName;
        sourceNode.parentId = destParent.id;
        attachToParent(sourceNode, destParent);
        registerPath(sourceNode);
        emitWatch('move', sourceNode, fromPath);
        kernel.emit('fs:move', { from: fromPath, to: sourceNode.path });
        return toMeta(sourceNode);
      }

      function cloneNode(node, parentId) {
        const copy = createNode({
          name: node.name,
          kind: node.kind,
          parentId,
          attrib: node.attrib,
          mime: node.mime,
          target: node.target,
          readonly: node.readonly
        });
        copy.created = now();
        copy.modified = now();
        if (node.kind === 'file') {
          copy.data = node.data.slice();
          copy.size = node.size;
        }
        if (node.children) {
          node.children.forEach((childId) => {
            const child = nodes.get(childId);
            cloneNode(child, copy.id);
          });
        }
        registerPath(copy);
        return copy;
      }

      function copy(src, dst, opts = {}) {
        ensureInitialised();
        const sourceNode = findNode(src);
        if (!sourceNode) throw Object.assign(new Error('Source not found'), { code: 'E_NOENT', path: src });
        const destPathInput = dst.startsWith('::') ? specialPaths.get(dst) || dst : dst;
        const destNormalized = pathUtil.normalize(destPathInput);
        const destParentPath = pathUtil.dirname(destNormalized);
        const destParent = findNode(destParentPath);
        if (!destParent || destParent.kind !== 'dir') {
          throw Object.assign(new Error('Destination parent missing'), { code: 'E_NOENT', path: destParentPath });
        }
        if (destParent.readonly) {
          throw Object.assign(new Error('Destination is read-only'), { code: 'E_DENIED', path: destParentPath });
        }
        const name = pathUtil.basename(destNormalized);
        if (destParent.children && destParent.children.has(name.toLowerCase()) && !opts.overwrite) {
          throw Object.assign(new Error('Destination exists'), { code: 'E_EXISTS', path: destNormalized });
        }
        const copyNode = cloneNode(sourceNode, destParent.id);
        copyNode.name = name;
        registerPath(copyNode);
        emitWatch('create', copyNode);
        kernel.emit('fs:create', { path: copyNode.path });
        return toMeta(copyNode);
      }

      function remove(path, toRecycleBin = true) {
        ensureInitialised();
        const node = findNode(path);
        if (!node) return;
        if (node.readonly) {
          throw Object.assign(new Error('Path is read-only'), { code: 'E_DENIED', path });
        }
        const fromPath = node.path;
        emitWatch('delete', node, fromPath);
        kernel.emit('fs:delete', { path: fromPath, meta: toMeta(node) });
        if (node.children) {
          node.children.forEach((childId) => {
            const child = nodes.get(childId);
            remove(child.path, false);
          });
        }
        detachFromParent(node);
        pathIndex.delete(pathKey(node.path));
        nodes.delete(node.id);
      }

      function createShortcut(target, shortcutPath, iconId) {
        ensureInitialised();
        const normalizedTarget = target.startsWith('::') ? specialPaths.get(target) || target : target;
        const destPathInput = shortcutPath.startsWith('::') ? specialPaths.get(shortcutPath) || shortcutPath : shortcutPath;
        const destNormalized = pathUtil.normalize(destPathInput);
        const parentPath = pathUtil.dirname(destNormalized);
        const parent = findNode(parentPath);
        if (!parent || parent.kind !== 'dir') {
          throw Object.assign(new Error('Destination parent missing'), { code: 'E_NOENT', path: parentPath });
        }
        const name = pathUtil.basename(destNormalized);
        if (parent.children && parent.children.has(name.toLowerCase())) {
          throw Object.assign(new Error('Destination exists'), { code: 'E_EXISTS', path: destNormalized });
        }
        const node = createNode({ name, kind: 'link', parentId: parent.id });
        node.target = normalizedTarget;
        node.icon = iconId;
        emitWatch('create', node);
        kernel.emit('fs:create', { path: node.path });
        return toMeta(node);
      }

      function resolve(pathOrShortcut) {
        ensureInitialised();
        const node = findNode(pathOrShortcut);
        if (!node) return pathOrShortcut;
        if (node.kind === 'link' && node.target) {
          return pathUtil.normalize(node.target);
        }
        return node.path;
      }

      function search(opts = {}) {
        ensureInitialised();
        const startNode = opts.path ? findNode(opts.path) : findNode('C:\\');
        if (!startNode) return [];
        const queue = [startNode];
        const results = [];
        const namePattern = opts.namePattern ? new RegExp('^' + opts.namePattern.replace(/\*/g, '.*').replace(/\?/g, '.') + '$', 'i') : null;
        while (queue.length) {
          const node = queue.shift();
          if (node !== startNode && node.kind === 'file') {
            let matches = true;
            if (namePattern && !namePattern.test(node.name)) {
              matches = false;
            }
            if (opts.exts && opts.exts.length && !opts.exts.includes(pathUtil.extname(node.name))) {
              matches = false;
            }
            if (matches) {
              results.push(toMeta(node));
              if (opts.maxResults && results.length >= opts.maxResults) break;
            }
          }
          if (node.children && (opts.recursive !== false || node === startNode)) {
            node.children.forEach((childId) => {
              const child = nodes.get(childId);
              if (child && child.kind === 'dir') queue.push(child);
              else if (child) queue.push(child);
            });
          }
        }
        return results;
      }

      function watch(pathOrRoot, cb) {
        ensureInitialised();
        const key = pathOrRoot === '::all'
          ? '::all'
          : pathKey((pathOrRoot && pathOrRoot.startsWith('::')) ? (specialPaths.get(pathOrRoot) || pathOrRoot) : pathUtil.normalize(pathOrRoot));
        if (!watchers.has(key)) {
          watchers.set(key, new Set());
        }
        watchers.get(key).add(cb);
        return () => {
          if (!watchers.has(key)) return;
          watchers.get(key).delete(cb);
        };
      }

      function download(path) {
        ensureInitialised();
        if (typeof document === 'undefined') return;
        read(path, 'bytes').then((bytes) => {
          const meta = stat(path);
          const blob = new Blob([bytes], { type: meta?.mime || 'application/octet-stream' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = meta?.name || 'download.bin';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
      }

      function init() {
        nodes.clear();
        pathIndex.clear();
        specialPaths.clear();

        const drives = ['A', 'C', 'D', 'N'];
        drives.forEach((driveLetter) => {
          const root = {
            id: kernel.uid('fs'),
            kind: 'dir',
            name: `${driveLetter}:`,
            parentId: null,
            drive: driveLetter,
            children: new Map(),
            size: 0,
            created: now(),
            modified: now(),
            attrib: driveLetter === 'D' || driveLetter === 'N' ? { R: true } : undefined,
            mime: undefined,
            target: undefined,
            readonly: driveLetter === 'D' || driveLetter === 'N',
            data: null,
            path: `${driveLetter}:\\`
          };
          nodes.set(root.id, root);
          pathIndex.set(pathKey(root.path), root.id);
        });

        const desktop = ensureDir('C:\\Desktop');
        const docs = ensureDir('C:\\Documents');
        const system = ensureDir('C:\\System');
        const printers = ensureDir('C:\\System\\Printers');
        const controlPanel = ensureDir('C:\\System\\Control Panel');
        const recycle = ensureDir('C:\\Recycle Bin');

        specialPaths.set('::desktop', desktop.path);
        specialPaths.set('::documents', docs.path);
        specialPaths.set('::controlpanel', controlPanel.path);
        specialPaths.set('::printers', printers.path);
        specialPaths.set('::recyclebin', recycle.path);
        specialPaths.set('::network', 'N:\\');

        initialised = true;
      }

      function reset() {
        initialised = false;
        nodes.clear();
        pathIndex.clear();
        specialPaths.clear();
      }

      return Object.freeze({
        init,
        reset,
        stat,
        exists,
        list,
        read,
        write,
        mkdir,
        move,
        copy,
        remove,
        createShortcut,
        resolve,
        search,
        watch,
        download,
        special: Object.freeze({
          desktop: '::desktop',
          controlPanel: '::controlpanel',
          printers: '::printers',
          recycleBin: '::recyclebin',
          network: '::network',
          documents: '::documents'
        })
      });
    });

    define('app/explorer', ['svc/window', 'svc/vfs', 'util/path'], function (windowSvc, vfs, pathUtil) {
      function createTreeItem(label, path, currentPath, onSelect) {
        const item = document.createElement('div');
        item.className = 'explorer__tree-item';
        item.textContent = label;
        item.dataset.path = path;
        const candidate = path.startsWith('::') ? vfs.resolve(path) : path;
        if (pathUtil.normalize(candidate) === pathUtil.normalize(currentPath)) {
          item.dataset.active = 'true';
        }
        item.addEventListener('click', () => onSelect(path));
        return item;
      }

      function renderTree(sidebar, currentPath, onSelect) {
        sidebar.innerHTML = '';
        const items = [
          { label: 'Desktop', path: vfs.special.desktop },
          { label: 'Documents', path: vfs.special.documents },
          { label: 'C:\\', path: 'C:\\' },
          { label: 'A:\\ (Floppy)', path: 'A:\\' },
          { label: 'D:\\ (CD-ROM)', path: 'D:\\' },
          { label: 'Network', path: vfs.special.network }
        ];
        items.forEach((entry) => {
          const node = createTreeItem(entry.label, entry.path, currentPath, onSelect);
          sidebar.appendChild(node);
        });
      }

      function formatSize(bytes) {
        if (bytes == null) return '';
        if (bytes < 1024) return `${bytes} bytes`;
        const kb = bytes / 1024;
        if (kb < 1024) return `${kb.toFixed(1)} KB`;
        const mb = kb / 1024;
        return `${mb.toFixed(1)} MB`;
      }

      function createListRow(meta, onOpen, onSelect, isParent) {
        const tr = document.createElement('tr');
        tr.dataset.path = meta.path;
        if (isParent) tr.dataset.parent = 'true';
        const nameCell = document.createElement('td');
        nameCell.textContent = meta.name;
        const typeCell = document.createElement('td');
        typeCell.textContent = meta.kind === 'dir' ? 'Folder' : (meta.ext || 'File');
        const sizeCell = document.createElement('td');
        sizeCell.textContent = meta.kind === 'file' ? formatSize(meta.size) : '';
        tr.appendChild(nameCell);
        tr.appendChild(typeCell);
        tr.appendChild(sizeCell);
        tr.addEventListener('click', (ev) => {
          ev.stopPropagation();
          onSelect(meta.path, tr);
        });
        tr.addEventListener('dblclick', (ev) => {
          ev.preventDefault();
          onOpen(meta, tr.dataset.parent === 'true');
        });
        return tr;
      }

      function explorerWindow(opts = {}) {
        const resolved = vfs.resolve(opts.path || vfs.special.desktop);
        let currentPath = resolved;
        const container = document.createElement('div');
        container.className = 'explorer';

        const sidebar = document.createElement('div');
        sidebar.className = 'explorer__sidebar';
        const content = document.createElement('div');
        content.className = 'explorer__content';
        const toolbar = document.createElement('div');
        toolbar.className = 'explorer__toolbar';
        const list = document.createElement('div');
        list.className = 'explorer__list';
        const status = document.createElement('div');
        status.className = 'explorer__status';

        container.appendChild(sidebar);
        container.appendChild(content);
        content.appendChild(toolbar);
        content.appendChild(list);
        content.appendChild(status);

        const btnNewFolder = document.createElement('button');
        btnNewFolder.textContent = 'New Folder';
        const btnNewText = document.createElement('button');
        btnNewText.textContent = 'New Text Document';
        const btnDelete = document.createElement('button');
        btnDelete.textContent = 'Delete';

        toolbar.appendChild(btnNewFolder);
        toolbar.appendChild(btnNewText);
        toolbar.appendChild(btnDelete);

        let selectedPath = null;
        let unwatch = null;

        function updateStatus(text) {
          status.textContent = text;
        }

        function clearSelection() {
          selectedPath = null;
          list.querySelectorAll('tr[data-selected="true"]').forEach((row) => {
            row.dataset.selected = 'false';
            row.removeAttribute('data-selected');
          });
        }

        function selectRow(path, row) {
          clearSelection();
          selectedPath = path;
          row.dataset.selected = 'true';
        }

        function openPath(path) {
          currentPath = vfs.resolve(path);
          refresh();
        }

        function createUniqueName(baseName, ext = '') {
          const existing = new Set(vfs.list(currentPath).map((meta) => meta.name.toLowerCase()));
          let name = `${baseName}${ext}`;
          if (!existing.has(name.toLowerCase())) return name;
          let counter = 2;
          while (existing.has(`${baseName} (${counter})${ext}`.toLowerCase())) {
            counter += 1;
          }
          return `${baseName} (${counter})${ext}`;
        }

        btnNewFolder.addEventListener('click', () => {
          try {
            const name = createUniqueName('New Folder');
            vfs.mkdir(pathUtil.join(currentPath, name));
          } catch (err) {
            console.error(err);
          }
        });

        btnNewText.addEventListener('click', async () => {
          const name = createUniqueName('New Text Document', '.txt');
          await vfs.write(pathUtil.join(currentPath, name), '');
        });

        btnDelete.addEventListener('click', () => {
          if (!selectedPath) return;
          try {
            vfs.remove(selectedPath, false);
            selectedPath = null;
          } catch (err) {
            console.error(err);
          }
        });

        function refresh() {
          renderTree(sidebar, currentPath, openPath);
          if (unwatch) {
            unwatch();
          }
          unwatch = vfs.watch(currentPath, () => refreshList());
          refreshList();
        }

        function refreshList() {
          const table = document.createElement('table');
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');
          ['Name', 'Type', 'Size'].forEach((label) => {
            const th = document.createElement('th');
            th.textContent = label;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          table.appendChild(thead);
          const tbody = document.createElement('tbody');

          const currentMeta = vfs.stat(currentPath);
          const parentPath = currentMeta ? pathUtil.dirname(currentMeta.path) : currentPath;
          if (parentPath && parentPath !== currentMeta.path) {
            const meta = { path: parentPath, name: '..', kind: 'dir', ext: '', size: 0 };
            const row = createListRow(meta, () => openPath(parentPath), () => {}, true);
            tbody.appendChild(row);
          }

          const entries = vfs.list(currentPath, { showHidden: false });
          entries.forEach((meta) => {
            const row = createListRow(meta, (entryMeta, isParent) => {
              if (entryMeta.kind === 'dir') {
                openPath(entryMeta.path);
              }
            }, (path, rowEl) => selectRow(path, rowEl));
            tbody.appendChild(row);
          });

          table.appendChild(tbody);
          list.innerHTML = '';
          list.appendChild(table);
          updateStatus(`${entries.length} item(s)`);
        }

        container.addEventListener('click', () => clearSelection());

        renderTree(sidebar, currentPath, openPath);
        unwatch = vfs.watch(currentPath, () => refreshList());
        refreshList();

        const win = windowSvc.create({
          title: opts.title || 'Explorer',
          width: opts.width || 520,
          height: opts.height || 360,
          content: container
        });

        const originalClose = win.close;
        win.close = () => {
          if (unwatch) unwatch();
          return originalClose();
        };

        return win;
      }

      return Object.freeze({ launch: explorerWindow });
    });
  </script>
  <script id="boot">
    (function () {
      function ready(fn) {
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          fn();
        } else {
          document.addEventListener('DOMContentLoaded', fn);
        }
      }

      ready(async function () {
        const kernel = require('core/kernel');
        const settings = require('svc/settings');
        const display = require('svc/display');
        const windowSvc = require('svc/window');
        const vfs = require('svc/vfs');
        const explorer = require('app/explorer');

        display.init({
          crt: document.getElementById('crt'),
          desktop: document.getElementById('desktop-root'),
          monitor: document.getElementById('monitor')
        });

        windowSvc.init({
          desktop: document.getElementById('desktop-root'),
          taskband: document.getElementById('taskband'),
          template: document.getElementById('tpl-window'),
          systemMenu: document.getElementById('system-menu'),
          taskSwitcher: document.getElementById('task-switcher'),
          taskSwitcherList: document.getElementById('task-switcher-list'),
          startButton: document.getElementById('start-button'),
          createWindowElement: () => {
            const template = document.getElementById('tpl-window');
            const frag = template.content.cloneNode(true);
            return frag.firstElementChild;
          }
        });

        vfs.reset();
        vfs.init();
        await Promise.all([
          vfs.write('C:\\Documents\\Welcome.txt', 'Welcome to Win95Sim. This document lives entirely in memory.'),
          vfs.mkdir('C:\\Desktop\\Projects').catch(() => null),
          vfs.write('C:\\Desktop\\Projects\\todo.txt', '• Build Explorer\n• Celebrate phase 2')
        ]);

        explorer.launch({ path: vfs.special.desktop, width: 600, height: 400 });

        document.getElementById('boot-splash').style.display = 'none';

        window.__win95TestApi = {
          services: { kernel, settings, display, window: windowSvc, vfs },
          explorer,
          async reset() {
            document.getElementById('desktop-root').innerHTML = '';
            windowSvc.init({
              desktop: document.getElementById('desktop-root'),
              taskband: document.getElementById('taskband'),
              template: document.getElementById('tpl-window'),
              systemMenu: document.getElementById('system-menu'),
              taskSwitcher: document.getElementById('task-switcher'),
              taskSwitcherList: document.getElementById('task-switcher-list'),
              startButton: document.getElementById('start-button'),
              createWindowElement: () => {
                const template = document.getElementById('tpl-window');
                const frag = template.content.cloneNode(true);
                return frag.firstElementChild;
              }
            });
            vfs.reset();
            vfs.init();
          }
        };
      });
    })();
  </script>
</body>
